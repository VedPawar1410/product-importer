version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-importer-web
    command: ./run_web.sh  # Override Dockerfile CMD for local dev (web only)
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - upload_data:/data
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/products
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UVICORN_WORKERS: 4
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: product-importer-worker
    volumes:
      - .:/code
      - upload_data:/data
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/products
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_CONCURRENCY: 4
      CELERY_LOG_LEVEL: info
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: product-importer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: product-importer-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  upload_data:
