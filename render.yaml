services:
  # FastAPI Web Service
  - type: web
    name: product-importer-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-importer-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: UVICORN_WORKERS
        value: "1"
    disk:
      name: web-uploads
      mountPath: /data
      sizeGB: 1

  # Celery Worker Service
  - type: worker
    name: product-importer-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-importer-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: CELERY_CONCURRENCY
        value: "2"
      - key: CELERY_LOG_LEVEL
        value: "info"
    # Note: Worker uses the same disk as web for shared uploads
    # In Render, we need to use a shared mount approach or object storage
    # For now, worker will process files uploaded to web's disk

  # Redis Instance
  - type: redis
    name: product-importer-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  # PostgreSQL Database
  - name: product-importer-db
    databaseName: products
    plan: free
