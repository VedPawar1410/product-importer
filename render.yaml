services:
  # FastAPI web server + Celery worker in ONE container (run_web_with_worker.sh).
  # Render's free plan has no background-worker service type, and sharing the
  # container also lets the worker read uploads from /tmp (see UPLOAD_DIR).
  - type: web
    name: product-importer-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Postgres lives outside Render (e.g. Neon's free tier): Render's free
      # Postgres is deleted 30 days after creation. Paste the connection string
      # in the dashboard; it's a secret, so it isn't stored here.
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: UVICORN_WORKERS
        value: "1"
      # One import at a time keeps the shared container inside the free 512 MB.
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: CELERY_LOG_LEVEL
        value: "info"

  # Redis (Render Key Value): Celery's job queue + upload progress. Only small
  # messages go through it; uploaded files stay on disk.
  - type: redis
    name: product-importer-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []  # required on the free plan; only Render services use it
