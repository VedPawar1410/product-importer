services:
  # FastAPI Web Service (includes Celery worker in same container)
  - type: web
    name: product-importer-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-importer-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: product-importer-redis
          property: connectionString
      - key: UVICORN_WORKERS
        value: "1"
      - key: CELERY_CONCURRENCY
        value: "2"
      - key: CELERY_LOG_LEVEL
        value: "info"
    # Note: disk removed - not supported on free tier
    # Files are stored in Redis instead
    # Note: Celery worker runs in same container as web (free tier limitation)

  # Redis Instance
  - type: redis
    name: product-importer-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []  # Allow all IPs (required for free tier)

databases:
  # PostgreSQL Database
  - name: product-importer-db
    databaseName: products
    plan: free
